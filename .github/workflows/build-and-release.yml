name: Elynos CI/CD - Build APK, AAB & Release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'test/**'
      - 'docs/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'test/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Check Flutter & Android Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB Release)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elynos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elynos-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1-release' }}
          name: "Elynos AI v1.0.1 (Latest Release)"
          body: |
            ## 🚀 Elynos AI v1.0.1 - Production Release
            **Model**: Elynos 1 Axiom (Super Intelligent)
            **Features**:
            - 100% Offline-First on-device inference with ultra-low RAM (<150MB)
            - 100k Virtual Context Paging via local SQLite
            - On-Device Low-RAM Training & Episodic Memory
            - Grok-Inspired Dark Mode UI/UX
            - Multi-App Connectors (GitHub, Google Workspace, Slack, Spotify)
            - Modes: Fast, Expert (Deep Think), Build (Agentic), Study (LaTeX), Goal, Imagine
            
            ### Included Assets:
            - `app-release.apk`: Direct Android installation package.
            - `app-release.aab`: Google Play Store publication bundle.
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
