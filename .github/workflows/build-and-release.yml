name: Elynos CI/CD - Build APK, AAB & Release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'test/**'
      - 'docs/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'test/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Check Flutter & Android Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB Release)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elynos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elynos-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.3-release' }}
          name: "Elynos AI v1.0.3 (Sovereign Intelligence & Math)"
          make_latest: true
          body: |
            ## 🚀 Elynos AI v1.0.3 - Sovereign Intelligence & Math Architecture
            **Model**: Elynos 1 Axiom Dual-Engine Framework (Offline Edge + Super Intelligence)
            
            ### What's New in v1.0.3:
            - **Multi-Perspective Heavy Mode**: Solves complex engineering queries (e.g. Scientific Calculator) through a 3-agent panel: Lead Architect (specifications), Implementation Specialist (complete runnable Flutter/Dart code with 1-tap copy), and Verification Auditor (invariants).
            - **Seamless Multi-Turn Context Continuity**: Eradicated conversational amnesia. Follow-ups like *"the principles"* or *"continue"* accurately retain full context from prior turns.
            - **Clean Container-Free LaTeX Math**: Rendered directly in-flow with clean serif typography and horizontal scroll support, removing ugly grey border boxes and formula labels.
            - **Accurate Dynamic Thinking Timers**: Fixed false "Thought for 1s" pills on instant responses; deep reasoning duration is dynamically computed based on token density.
            - **Resilient Local Database Storage**: Fixed past chats loading as empty by querying non-temporary messages and isolating row deserialization.
            - **In-App Update Checker**: Added a direct "Check for Updates" tile in the navigation drawer linked to the GitHub release repository.
            
            ### Included Assets:
            - `app-release.apk`: Direct Android installation package.
            - `app-release.aab`: Google Play Store publication bundle.
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
