name: Elynos CI/CD - Build APK, AAB & Release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'test/**'
      - 'docs/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'test/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Check Flutter & Android Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB Release)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elynos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elynos-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.2-release' }}
          name: "Elynos AI v1.0.2 (Super Intelligent Update)"
          body: |
            ## 🚀 Elynos AI v1.0.2 - Super Intelligent Update
            **Model**: Elynos 1 Axiom Dual-Engine Architecture
            
            ### What's New in v1.0.2:
            - **Super Intelligent Foundation Inference**: Fixed online AI bridge (removed paid query parameter, restored lightning-fast GPT-4-class answers with zero canned responses).
            - **Seamless Multi-Turn Context**: Remembers conversation turns, resolves topic switches, and switches back to prior topics gracefully.
            - **Self-Aware Intelligence**: Identifies model engine (**Elynos 1 Axiom**), specifications, and multimodal capabilities.
            - **Instant Text Input Container Click**: Wrapped entire input container in responsive hit-testing so tapping anywhere instantly focuses keyboard and starts typing.
            - **Autonomous Goal Milestone Runner**: Interactive checklist automatically progresses and ticks off milestones in sequence with haptics.
            - **Unified Imagine & Build Streams**: Imagine and Build tabs now share the full interactive chat stream with synchronized smooth scrolling.
            - **Connectors**: Marked as "Coming Soon in v1.1.0" with direct 1-tap code copy.
            
            ### Included Assets:
            - `app-release.apk`: Direct Android installation package.
            - `app-release.aab`: Google Play Store publication bundle.
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
