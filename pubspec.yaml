name: elynos_ai
description: "Elynos AI - Offline Autonomous On-Device AI Chatbot"
publish_to: "none"
version: 1.0.3+5

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons, Typography
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  flutter_highlight: ^0.7.0

  # Markdown Rendering
  flutter_markdown: ^0.7.4+1

  # State Management
  provider: ^6.1.2

  # Local Storage & Database (100% Offline & Private)
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Network & App Connectors (Only used when online)
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1

  # File Attachments, Unzip & Document Generation (PDF/MD/Docs)
  file_picker: ^8.1.4
  archive: ^3.6.1
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/knowledge/
